<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Дневник Тома Рэддла</title>
  <style>
    body {
      background: black;
      color: #cfcfcf;
      font-family: "Courier New", monospace;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    #output {
      min-height: 150px;
      border: 1px solid #444;
      padding: 10px;
      margin-bottom: 10px;
      white-space: pre-wrap;
    }
    textarea {
      width: 100%;
      height: 60px;
      background: black;
      color: #cfcfcf;
      border: 1px solid #444;
      padding: 8px;
      font-family: inherit;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #222;
      border: none;
      color: #cfcfcf;
      font-size: 18px;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover {
      background: #333;
    }
  </style>
</head>
<body>

  <h1>Дневник Тома Рэддла</h1>

  <div id="output"></div>

  <textarea id="input" placeholder="Напиши свой вопрос…"></textarea>
  <button onclick="answer()">Спросить</button>

  <script>
    const replies = [
      "Я знаю, что ты думаешь…",
      "Не всё, что ищешь, стоит знать.",
      "Тьма питается твоим любопытством.",
      "Продолжай.",
      "Вглядись внимательнее…",
      "Я здесь.",
    ];

    function answer() {
      const out = document.getElementById("output");
      const text = document.getElementById("input").value.trim();
      if (text === "") return;

      // отключаем кнопку, чтобы не спамить
      const btn = document.querySelector("button");
      btn.disabled = true;

      // показываем эффект "думает"
      out.innerHTML = "…дневник думает…";

      setTimeout(() => {
        const reply = replies[Math.floor(Math.random() * replies.length)];
        out.innerHTML = ""; // очищаем
        typeWriter(out, reply, () => {
          btn.disabled = false;
        });
      }, 800);
    }

    function typeWriter(element, text, callback) {
      let i = 0;
      const speed = 50; // скорость печати (мс)
      const interval = setInterval(() => {
        element.innerHTML += text.charAt(i);
        i++;
        if (i >= text.length) {
          clearInterval(interval);
          if (callback) callback();
        }
      }, speed);
    }
  </script>

</body>
</html>
