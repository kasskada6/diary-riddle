<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Дневник Тома Рэддла</title>
  <style>
    /* Фон дневника */
    body {
      background-image: url('everytexture.com-stock-paper-texture-00076.jpg');
      background-size: cover;
      background-repeat: repeat;
      background-color: #f5f1e7;
      color: #3b2e2a;
      font-family: "Times New Roman", serif;
      padding: 20px;
    }

    h1 {
      text-align: center;
      letter-spacing: 2px;
      margin-bottom: 30px;
    }

    /* Контейнер рамки + текста */
    #frame-wrapper {
      position: relative;
      display: inline-block;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
    }

    /* Рамка кровавая */
    .frame-img {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none; /* чтобы рамка не мешала кликам */
      z-index: 1;
    }

    /* Блок вывода текста */
    #output {
      position: relative;
      z-index: 2;
      min-height: 150px;
      padding: 20px;
      margin-bottom: 10px;
      background-color: rgba(245, 241, 231, 0.6); /* лёгкая прозрачность, видно рамку */
      white-space: pre-wrap;

      /* Мерцание текста */
      animation: flicker 0.2s infinite alternate;
    }

    @keyframes flicker {
      0% { opacity: 0.8; text-shadow: 0 0 2px #3b2e2a; }
      25% { opacity: 0.95; text-shadow: 0 0 4px #5a3f2d; }
      50% { opacity: 1; text-shadow: 0 0 6px #5a3f2d; }
      75% { opacity: 0.9; text-shadow: 0 0 3px #3b2e2a; }
      100% { opacity: 0.85; text-shadow: 0 0 2px #3b2e2a; }
    }

    /* Поле ввода */
    #input {
      width: 100%;
      height: 60px;
      background-color: black;
      color: #cfcfcf;
      border: 1px solid #444;
      padding: 8px;
      font-family: inherit;
      font-size: 16px;
      resize: none;
    }

    /* Кнопка */
    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background-color: #111;
      color: #cfcfcf;
      border: 1px solid #333;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <h1>Дневник Тома Рэддла</h1>

  <!-- Контейнер с кровавой рамкой -->
  <div id="frame-wrapper">
    <img src="images/blood-png-7161.png" class="frame-img">
    <div id="output">Дневник ждёт твоего вопроса…</div>
  </div>

  <textarea id="input" placeholder="Напиши свой вопрос…"></textarea>
  <button id="askBtn">Спросить</button>

  <script>
    const output = document.getElementById("output");
    const input = document.getElementById("input");
    const button = document.getElementById("askBtn");

    // Простейшие ответы (позже можно подключить ChatGPT)
    const replies = [
      "Я знаю, что ты думаешь…",
      "Не всё, что ищешь, стоит знать.",
      "Тьма питается твоим любопытством.",
      "Продолжай.",
      "Вглядись внимательнее…",
      "Я здесь.",
    ];

    // Эффект печати по буквам
    function typeWriter(text, speed = 45) {
      output.innerHTML = "";
      let i = 0;
      button.disabled = true;

      const interval = setInterval(() => {
        output.innerHTML += text.charAt(i);
        i++;
        if (i >= text.length) {
          clearInterval(interval);
          button.disabled = false;
        }
      }, speed);
    }

    button.addEventListener("click", () => {
      const question = input.value.trim();
      if (!question) return;

      output.innerHTML = "…чернила проявляются…";
      button.disabled = true;

      setTimeout(() => {
        const reply = replies[Math.floor(Math.random() * replies.length)];
        typeWriter(reply);
      }, 800);
    });
  </script>

</body>
</html>
