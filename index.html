<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Дневник Тома Рэддла</title>
  
 <style>
  body {
    background: black;
    color: #cfcfcf;
    font-family: "Times New Roman", serif;
    padding: 20px;
  }

  h1 {
    text-align: center;
    letter-spacing: 2px;
  }

  #output {
    min-height: 150px;
    border: 1px solid #444;
    padding: 12px;
    margin-bottom: 10px;
    white-space: pre-wrap;
    animation: flicker 4s infinite;
  }

  @keyframes flicker {
    0% { opacity: 1; }
    50% { opacity: 0.95; }
    70% { opacity: 0.9; }
    100% { opacity: 1; }
  }

  textarea {
    width: 100%;
    height: 60px;
    background: black;
    color: #cfcfcf;
    border: 1px solid #444;
    padding: 8px;
    font-family: inherit;
    font-size: 16px;
  }

  button {
    width: 100%;
    margin-top: 10px;
    padding: 12px;
    background: #111;
    color: #cfcfcf;
    border: 1px solid #333;
    cursor: pointer;
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
</style>
  
</head>
<body>

  <h1>Дневник Тома Рэддла</h1>

  <div id="output">Дневник ждёт твоего вопроса…</div>

  <textarea id="input" placeholder="Напиши свой вопрос…"></textarea>
  <button id="askBtn">Спросить</button>

 <script>
  const output = document.getElementById("output");
  const input = document.getElementById("input");
  const button = document.getElementById("askBtn");

  function typeWriter(text, speed = 45) {
    output.innerHTML = "";
    let i = 0;
    button.disabled = true;

    const interval = setInterval(() => {
      output.innerHTML += text.charAt(i);
      i++;
      if (i >= text.length) {
        clearInterval(interval);
        button.disabled = false;
      }
    }, speed);
  }

  button.addEventListener("click", () => {
    if (!input.value.trim()) return;
    typeWriter("…чернила проявляются…\n\nЯ знаю, что ты ищешь.");
  });
</script>

</body>
</html>
