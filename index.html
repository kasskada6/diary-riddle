<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Дневник Тома Рэддла</title>

<style>
body {
  background-image: url('everytexture.com-stock-paper-texture-00076.jpg');
  background-size: cover;
  background-repeat: repeat;
  background-color: #f5f1e7;
  font-family: "Times New Roman", serif;
  padding: 20px;
  color: #3b2e2a;
}

h1 {
  text-align: center;
  letter-spacing: 2px;
  margin-bottom: 30px;
}

/* === ОБЩИЙ КОНТЕЙНЕР === */
#frame-wrapper {
  position: relative;
  max-width: 800px;
  margin: 0 auto 20px auto;
}

/* === РАМКА (КАК ЕСТЬ, НЕ ТРОГАЕМ) === */
#frame-wrapper img {
  width: 100%;
  display: block;
}

/* === ТЕКСТ ВНУТРИ РАМКИ === */
#output {
  position: absolute;
  top: 12%;
  left: 12%;
  width: 76%;
  height: 76%;
  box-sizing: border-box;

  /* ВАЖНО: прозрачный фон */
  background: transparent;

  padding: 20px;
  overflow-y: auto;

  color: #2b1d1a;
  font-size: 18px;
}

/* === ВВОД === */
textarea {
  width: 100%;
  height: 60px;
  background: black;
  color: #cfcfcf;
  border: 1px solid #444;
  padding: 8px;
  font-size: 16px;
  box-sizing: border-box;
}

button {
  width: 100%;
  margin-top: 10px;
  padding: 12px;
  background: #111;
  color: #cfcfcf;
  border: 1px solid #333;
  cursor: pointer;
}
</style>
</head>

<body>

<h1>Дневник Тома Рэддла</h1>

<div id="frame-wrapper">
  <img src="blood-png-7161.png" alt="Рамка">
  <div id="output">
    Дневник ждёт твоего вопроса…
  </div>
</div>

<textarea id="input" placeholder="Напиши свой вопрос…"></textarea>
<button id="askBtn">Спросить</button>

<script>
const output = document.getElementById("output");
const input = document.getElementById("input");

const replies = [
  "Я знаю, что ты ищешь…",
  "Не всё должно быть произнесено.",
  "Ты уже открыл больше, чем следовало.",
  "Продолжай.",
  "Я здесь."
];

document.getElementById("askBtn").onclick = () => {
  if (!input.value.trim()) return;

  output.textContent =
    replies[Math.floor(Math.random() * replies.length)];

  input.value = "";
};
</script>

</body>
</html>
