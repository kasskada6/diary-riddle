<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Дневник Тома Рэддла</title>

<style>
body {
  background-image: url('everytexture.com-stock-paper-texture-00076.jpg');
  background-size: cover;
  background-repeat: repeat;
  background-color: #f5f1e7;
  font-family: "Times New Roman", serif;
  padding: 20px;
  color: #3b2e2a;
}

h1 {
  text-align: center;
  letter-spacing: 2px;
  margin-bottom: 30px;
}

/* ===== КОНТЕЙНЕР ===== */
#frame-wrapper {
  position: relative;
  max-width: 800px;
  margin: 0 auto 20px auto;
}

/* ===== ТЁМНАЯ ПОДЛОЖКА ПОД РАМКОЙ ===== */
#frame-bg {
  background: #1a0f0f;
  padding: 20px;
}

/* ===== РАМКА ===== */
.frame-img {
  width: 100%;
  display: block;
}

/* ===== ОБЛАСТЬ ТЕКСТА ===== */
#output {
  position: absolute;
  inset: 60px;
  background-color: #f5f1e7;
  padding: 20px;
  box-sizing: border-box;
}

textarea {
  width: 100%;
  height: 60px;
  background: black;
  color: #cfcfcf;
  border: 1px solid #444;
  padding: 8px;
  font-size: 16px;
}

button {
  width: 100%;
  margin-top: 10px;
  padding: 12px;
  background: #111;
  color: #cfcfcf;
  border: 1px solid #333;
  cursor: pointer;
}
</style>
</head>

<body>

<h1>Дневник Тома Рэддла</h1>

<div id="frame-wrapper">
  <div id="frame-bg">
    <img src="blood-png-7161.png" class="frame-img">
  </div>

  <div id="output">
    Дневник ждёт твоего вопроса…
  </div>
</div>

<textarea id="input" placeholder="Напиши свой вопрос…"></textarea>
<button id="askBtn">Спросить</button>

<script>
const output = document.getElementById("output");
const input = document.getElementById("input");

const replies = [
  "Я знаю, что ты ищешь…",
  "Ты уже слишком далеко зашёл.",
  "Продолжай писать.",
  "Тьма наблюдает.",
  "Я здесь."
];

document.getElementById("askBtn").onclick = () => {
  if (!input.value.trim()) return;
  output.textContent =
    replies[Math.floor(Math.random() * replies.length)];
  input.value = "";
};
</script>

</body>
</html>
