<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Дневник Тома Рэддла</title>

<style>
body {
  background-image: url('everytexture.com-stock-paper-texture-00076.jpg');
  background-size: cover;
  background-repeat: repeat;
  background-color: #f5f1e7;
  font-family: "Times New Roman", serif;
  padding: 20px;
  color: #3b2e2a;
}

h1 {
  text-align: center;
  letter-spacing: 2px;
  margin-bottom: 30px;
}

/* ===== КОНТЕЙНЕР ===== */
#frame-wrapper {
  position: relative;
  max-width: 800px;
  margin: 0 auto 20px auto;
  isolation: isolate; /* 🔥 ВАЖНО */
}

/* ===== РАМКА (СТАТИЧНАЯ) ===== */
.frame-img {
  width: 100%;
  display: block;
  position: relative;
  z-index: 1;
}

/* ===== ОБЛАСТЬ ТЕКСТА ===== */
#output {
  position: absolute;
  inset: 40px;
  background-color: #f5f1e7; /* ❗️НЕ rgba */
  padding: 20px;
  z-index: 2;
  box-sizing: border-box;
}

/* ===== ЧЕРНИЛА ===== */
.ink {
  animation: flicker 0.25s infinite alternate;
}

@keyframes flicker {
  0%   { opacity: 0.85; text-shadow: 0 0 1px #3b2e2a; }
  50%  { opacity: 1;    text-shadow: 0 0 3px #5a3f2d; }
  100% { opacity: 0.9;  text-shadow: 0 0 1px #3b2e2a; }
}

textarea {
  width: 100%;
  height: 60px;
  background: black;
  color: #cfcfcf;
  border: 1px solid #444;
  padding: 8px;
  font-size: 16px;
  box-sizing: border-box;
}

button {
  width: 100%;
  margin-top: 10px;
  padding: 12px;
  background: #111;
  color: #cfcfcf;
  border: 1px solid #333;
  cursor: pointer;
}
</style>
</head>
