<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Дневник Тома Рэддла</title>
</head>

<body style="background:black; color:#cfcfcf; font-family:Times New Roman;">

  <h1>Дневник Тома Рэддла</h1>

  <div id="output" style="min-height:120px; border:1px solid #444; padding:10px; margin-bottom:10px;">
  </div>

  <textarea id="input" placeholder="Напиши вопрос..."
    style="width:100%; height:60px; background:black; color:#cfcfcf;"></textarea>

  <br><br>

  <button onclick="answer()">Спросить</button>

  <script>
    function answer() {
      const out = document.getElementById("output");
      const text = document.getElementById("input").value;

      if (text.trim() === "") return;

      out.innerHTML = "…дневник отвечает…<br><br>Ты слишком любопытен.";
    }
  </script>

</body>
</html>
